<h1>Veel videomängudest</h1>

<p>Videomänge saab mängida nii arvutis, konsoolis kui ka telefonis. Mõned mängud keskenduvad loo jutustamisele, teistes saab ehitada, avastada või teiste mängijatega võistelda. Mulle meeldivad kõige rohkem mängud, kus saab ise valida, mida teha.</p>
